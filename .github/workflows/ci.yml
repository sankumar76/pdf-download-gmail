# Pull-request gates (test-strategy section 9; PGD-12 AC-3). No secrets are configured here:
# the only credential used is the automatic, read-only GITHUB_TOKEN of the run.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment).
# Python dependencies are installed from hash-pinned files with --require-hashes (ADR-002).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every push to main keeps its full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: mypy gmail_pdf --strict

  test:
    name: test (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whole-package floor (80 %) is enforced on the Windows 3.12 leg and again on the
          # combined data in the coverage job. The other legs only report.
          - { leg: win-310, os: windows-latest, python: "3.10", fail_under: "0", upload: "no" }
          - { leg: win-311, os: windows-latest, python: "3.11", fail_under: "0", upload: "no" }
          - { leg: win-312, os: windows-latest, python: "3.12", fail_under: "80", upload: "yes" }
          - { leg: ubuntu-312, os: ubuntu-latest, python: "3.12", fail_under: "0", upload: "yes" }
          # macOS: core + CLI only (no GUI suite), coverage reported without a threshold.
          - { leg: macos-312, os: macos-latest, python: "3.12", fail_under: "0", upload: "no" }
    env:
      COVERAGE_FILE: .coverage.${{ matrix.leg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Test with branch coverage
        run: >-
          pytest -q -m "not perf" --cov=gmail_pdf --cov-branch
          --cov-report=term-missing --cov-fail-under=${{ matrix.fail_under }}
      - name: Upload coverage data
        if: matrix.upload == 'yes' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.leg }}
          path: .coverage.${{ matrix.leg }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares against origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine Windows and Ubuntu data
        run: |
          ls -la coverage-data
          coverage combine coverage-data/.coverage.*
          coverage xml -o coverage.xml
      - name: Whole package (branch coverage), at least 80 %
        run: coverage report --fail-under=80
      - name: Changed code, at least 80 %
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=80

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the commit range
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: pip-audit (known vulnerabilities in the pinned runtime set)
        run: pip-audit -r requirements.txt
      - name: bandit
        run: bandit -r gmail_pdf
      - name: Dependency allow-list (ADR-002)
        run: pytest -q tests/unit/test_dependency_allowlist.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install into a clean virtual environment
        run: |
          python -m venv clean-venv
          clean-venv/Scripts/python -m pip install --require-hashes -r requirements.txt
          clean-venv/Scripts/python -m pip install --no-deps dist/*.whl
      - name: Run the installed entry point
        run: clean-venv/Scripts/gmail-pdf --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
